budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
use_symbolic_prompt: true
symbolic_prompt_type: grounded_subgoal
# Training uses dataset GroundSG. Evaluation resolves this at runtime so one
# policy checkpoint is shared by Oracle and Qwen sources.
symbolic_source: none
